<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Valheim 1.0</title>
  <style>
    /* Norse Fontunu CDN üzerinden yüklüyoruz */
    @import url('https://fonts.cdnfonts.com/css/norse');

    /* Boşluklar */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #020111; 
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Uzay */
    .uzay {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #000000 0%, #150a30 70%, #190c42 100%);
    }

    /* Yıldızlar */
    .yıldız {
      position: absolute;
      background: rgb(240, 239, 226);
      opacity: 0.8;
      border-radius: 43%;
      animation: parılda 3s infinite alternate;
    }

    @keyframes parılda {
      0% { opacity: 0.2; }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .kayan-yıldız {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8); 
      opacity: 0;
      transform: rotate(-54deg); 
      animation: kayma 6s infinite linear;
    }

    .kayan-yıldız::after {
      content: '';
      position: absolute;
      left: 100%; 
      width: 150px; 
      height: 1px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(to right, rgb(245, 222, 173), rgba(255,255,255,0));
    }

    @keyframes kayma {
      0% {
        transform: rotate(-22deg) translateX(0);
        opacity: 1;
      }
      15% {
        opacity: 0;
      }
      100% {
        transform: rotate(-54deg) translateX(-1000px);
        opacity: 0;
      }
    }

    /* Geri Sayım CSS (Tam Merkez) */
    .geri-sayim-merkez {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      color: hsl(34, 97%, 58%);
      text-align: center;
      font-family: 'Norse', sans-serif;
      text-shadow: 0 0 20px rgba(245, 222, 173, 0.6);
      user-select: none;
      white-space: nowrap;
    }

    .sayac-kutu {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .rakam {
      font-size: 8rem; /* Büyütülmüş boyut */
      line-height: 1;
      flex: 0 0 3ch;
      width: 3ch;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .ayrac {
      font-size: 7rem;
      line-height: 1;
      color: hsl(34, 97%, 58%);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="uzay">
    <!-- Geri Sayım Alanı -->
    <div class="geri-sayim-merkez">
      <div class="sayac-kutu" id="sayac-alani">
        <span class="rakam" id="gun">--</span>
        <span class="ayrac">:</span>
        <span class="rakam" id="saat">--</span>
        <span class="ayrac">:</span>
        <span class="rakam" id="dakika">--</span>
        <span class="ayrac">:</span>
        <span class="rakam" id="saniye">--</span>
      </div>
    </div>

    <!-- Kayan Yıldızlar -->
    <div class="kayan-yıldız" style="top: 10%; left: 80%; animation-delay: 0s;"></div>
    <div class="kayan-yıldız" style="top: 30%; left: 60%; animation-delay: 3s;"></div>
    <div class="kayan-yıldız" style="top: 15%; left: 40%; animation-delay: 6s;"></div>
  </div>

  <script>
    // Arka Plan Yıldızları
    document.addEventListener("DOMContentLoaded", function() {
      const uzay = document.querySelector('.uzay');
      const yıldızmevcudu = 97; 
      for (let i = 0; i < yıldızmevcudu; i++) {
        const yıldız = document.createElement('div');
        yıldız.classList.add('yıldız');
        yıldız.style.left = `${Math.random() * 100}vw`;
        yıldız.style.top = `${Math.random() * 100}vh`;
        const size = Math.random() * 2 + 0.5;
        yıldız.style.width = `${size}px`;
        yıldız.style.height = `${size}px`;
        yıldız.style.animationDelay = `${Math.random() * 3}s`;
        yıldız.style.animationDuration = `${Math.random() * 2 + 2}s`; 
        uzay.appendChild(yıldız);
      }
    });

    // Geri Sayım Mantığı
    function hedeflenenTarihiAl() {
      const suAn = new Date();
      const yil = suAn.getFullYear();
      // Eylül = 8. ay index'i. 9 Eylül Saat 00:00:00
      let hedef = new Date(yil, 8, 9, 0, 0, 0); 
      
      if (suAn.getTime() > hedef.getTime()) {
        hedef = new Date(yil + 1, 8, 9, 0, 0, 0);
      }
      return hedef.getTime();
    }

    const hedefTarih = hedeflenenTarihiAl();

    function guncelleSayac() {
      const simdi = new Date().getTime();
      const mesafe = hedefTarih - simdi;

      if (mesafe <= 0) {
        document.getElementById("sayac-alani").innerHTML = "<span class='rakam'>The Time Has Come!</span>";
        return;
      }

      const gun = Math.floor(mesafe / (1000 * 60 * 60 * 24));
      const saat = Math.floor((mesafe % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const dakika = Math.floor((mesafe % (1000 * 60 * 60)) / (1000 * 60));
      const saniye = Math.floor((mesafe % (1000 * 60)) / 1000);

      document.getElementById("gun").textContent = gun.toString().padStart(2, '0');
      document.getElementById("saat").textContent = saat.toString().padStart(2, '0');
      document.getElementById("dakika").textContent = dakika.toString().padStart(2, '0');
      document.getElementById("saniye").textContent = saniye.toString().padStart(2, '0');
    }

    guncelleSayac();
    setInterval(guncelleSayac, 1000);
  </script>
</body>
</html>
